[project]
name = "mylangchin-uv-project"
version = "0.1.0"
description = "LangChain project with Upstage"
readme = "README.md"
authors = [
    { name = "bluejals13", email = "bluejals13@github.com" }
]

requires-python = ">=3.12,<3.13"

dependencies = [
    "docx2txt>=0.9",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.7",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langchain-upstage>=0.7.7",
    "langgraph>=1.2.14",
    "langserve>=0.3.3",
    "langsmith>=0.14.4",
    "openai>=3.26.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=5.0.0,<6.0.0",
    "sse-starlette>=3.5.0",
]

[project.scripts]
mylangchin-uv-project = "mylangchin_uv_project:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
