[project]
name = "ai-backend-lab"
version = "0.1.0"
description = "LangChain AI Workflow & Load Testing Lab"
readme = "README.md"
requires-python = ">=3.12"

# 운영 환경에 반드시 필요한 핵심 패키지
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-dotenv>=1.0.1",
    "tavily-python>=0.8.5",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-upstage>=0.4.0",
    "langchain-classic>=1.0.8",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
]

# 로컬 개발 및 테스트 환경에만 필요한 패키지 (uv add --dev 로 추가됨)
[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "httpx>=0.27.0"
]
