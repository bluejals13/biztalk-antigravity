<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI 문서/뉴스 심층 분석기</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; background: #f3f4f6; padding: 2rem; display: flex; justify-content: center; } 
        .container { max-width: 700px; width: 100%; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); } 
        .nav { margin-bottom: 20px; } 
        .nav a { color: #3b82f6; text-decoration: none; font-weight: bold; } 
        select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
        textarea { height: 150px; resize: vertical; line-height: 1.5; } 
        button { background: #3b82f6; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 1.05rem; font-weight: bold; transition: background 0.2s; } 
        button:hover { background: #2563eb; }
        button:disabled { background: #9ca3af; cursor: not-allowed; } 
        
        /* 개편된 결과창 스타일 */
        .result-box { margin-top: 24px; display: none; text-align: left; }
        .result-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; }
        
        .doc-title { font-size: 1.4rem; font-weight: bold; color: #1e3a8a; margin-top: 0; margin-bottom: 16px; line-height: 1.4; }
        .section-title { font-size: 1rem; font-weight: bold; color: #475569; margin: 16px 0 8px 0; display: flex; align-items: center; gap: 6px; }
        .doc-summary { color: #334155; line-height: 1.6; font-size: 1rem; margin-bottom: 16px; }
        
        /* 배지(태그) 스타일 */
        .tag-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
        .tag { padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
        .tag-keyword { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
        .tag-entity { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
        
        /* 리스트 스타일 */
        .takeaways { padding-left: 20px; margin: 0; color: #334155; line-height: 1.6; }
        .takeaways li { margin-bottom: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">← <a href="/">홈으로 돌아가기</a></div>

        <select id="model-provider">
            <!-- 기존 클라우드 모델 (완벽 유지) -->
            <option value="groq">🚀 Groq (Fast & Open Source)</option>
            <option value="openai">🧠 OpenAI (GPT-4o-mini)</option>
            <option value="gemini">⚡ Google (Gemini 1.5 Flash)</option>
            <option value="upstage">☀️ Upstage (Solar 1 Mini)</option>

            <!-- ✨ 새로 추가된 사내 로컬 모델 -->
            <option value="ollama_qwen3">🦙 사내망 (Qwen 3: 8B)</option>
            <option value="ollama_qwen25">🦙 사내망 (Qwen 2.5: 0.5B)</option>
            <option value="ollama_deepseek">🧠 사내망 (DeepSeek-R1: 8B)</option>
        </select>

        <div style="margin: 12px 0; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0;">
            <label for="length-range" style="font-size: 0.9rem; color: #374151; font-weight: bold; display: flex; justify-content: space-between;">
                <span>📏 요약 길이 조절 (1 ~ 5)</span>
                <span id="length-val" style="color: #2563eb; font-weight: bold;">2 (살짝 짧게, 기본)</span>
            </label>
            <input type="range" id="length-range" min="1" max="5" value="2" 
                   oninput="updateLengthLabel(this.value)"
                   style="width: 100%; margin-top: 8px; cursor: pointer;">
        </div>

        <h2>📰 AI 문서/뉴스 심층 분석기</h2>
        <textarea id="news-input" placeholder="분석할 긴 기사나 문서 본문을 붙여넣으세요..."></textarea>
        <button id="btn-submit" onclick="extractKeywords()">문서 분석하기</button>
        
        <!-- 결과가 출력될 컨테이너 -->
        <div id="result-box" class="result-box"></div>
    </div>

    <script>
        async function extractKeywords() {
            const input = document.getElementById('news-input').value.trim();
            const provider = document.getElementById('model-provider').value;
            const lengthLevel = parseInt(document.getElementById('length-range').value);
            const btn = document.getElementById('btn-submit');
            const resultBox = document.getElementById('result-box');
            
            if(input.length < 10) return alert("문서 내용을 조금 더 길게 입력하세요.");

            btn.disabled = true; btn.innerText = "🔍 AI가 문맥을 심층 분석 중입니다...";
            resultBox.style.display = 'none';

            try {
                const res = await fetch('/api/v1/news', { // 백엔드 라우터 경로에 맞게 수정 필요 시 수정
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        news_text: input, 
                        provider: provider, 
                        length_level: lengthLevel
                    })
                });
                
                const data = await res.json();
                
                if(res.ok) {
                    // JSON 데이터를 HTML UI로 예쁘게 조립
                    resultBox.innerHTML = `
                    <div class="result-card">
                                <h3 class="doc-title">📑 ${data.title}</h3>
            
                                <div class="section-title">📝 내용 요약</div>
                                <div class="doc-summary">${data.summary}</div>
            
                                <div class="section-title">🔑 핵심 키워드</div>
                                <div class="tag-container">
                                    ${data.keywords.map(k => `<span class="tag tag-keyword">#${k}</span>`).join('')}
                                </div>
            
                                <div class="section-title">🏢 주요 인물 및 기관</div>
                                <div class="tag-container">
                                    ${data.entities.map(e => `<span class="tag tag-entity">${e}</span>`).join('')}
                                </div>
            
                                <div class="section-title">💡 핵심 시사점</div>
                                <ul class="takeaways">
                                    ${data.takeaways.map(t => `<li>${t}</li>`).join('')}
                                </ul>

                                <!-- 💡 API/JSON 스펙이 존재할 경우에만 렌더링되는 블록 -->
                                ${data.api_json_spec ? `
                                    <div class="section-title" style="margin-top: 24px;">💻 기술 및 API JSON 명세</div>
                                    <div style="background: #1e293b; color: #e2e8f0; padding: 16px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; font-size: 0.9rem; overflow-x: auto; border: 1px solid #334155;">${data.api_json_spec}</div>
                                ` : ''}
                            </div>
                        `;
                } else {
                    resultBox.innerHTML = `<div class="result-card" style="color:red; font-weight:bold;">❌ 오류: ${data.detail}</div>`;
                }
                resultBox.style.display = 'block';
                
            } catch (e) { 
                resultBox.style.display = 'block';
                resultBox.innerHTML = `<div class="result-card" style="color:red; font-weight:bold;">🔌 백엔드 서버와 통신할 수 없습니다.</div>`; 
            }
            
            btn.disabled = false; btn.innerText = "문서 분석하기";
        }

        function updateLengthLabel(val) {
            const labels = {
                "1": "1 (아주 짧게 / 핵심만)",
                "2": "2 (살짝 짧게, 기본)",
                "3": "3 (보통 / 표준 단락)",
                "4": "4 (길고 상세하게)",
                "5": "5 (최대 상세 / 배경 포함)"
            };
            document.getElementById('length-val').innerText = labels[val] || val;
        }
    </script>
</body>
</html>
