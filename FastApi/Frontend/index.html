<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI Backend Lab - Home</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f3f4f6; padding: 2rem; display: flex; justify-content: center; }
        .container { max-width: 800px; width: 100%; text-align: center; }
        h1 { color: #111827; margin-bottom: 2rem; }
        .menu-grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
        .card { background: white; border-radius: 12px; padding: 24px; text-decoration: none; color: #1f2937; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: transform 0.2s; display: block; }
        .card:hover { transform: translateY(-5px); background: #f8fafc; }
        .card h2 { margin: 0 0 10px 0; font-size: 1.25rem; color: #2563eb; }
        .card p { margin: 0; font-size: 0.95rem; color: #6b7280; }
        .card.history { background: #eff6ff; border: 2px dashed #3b82f6; }
        .card.history h2 { color: #1d4ed8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 AI Backend Lab</h1>
        <div class="menu-grid">
            <a href="recipe.html" class="card">
                <h2>🍳 문제 1-1</h2>
                <p>AI 요리사 (기본 체인)</p>
            </a>
            <a href="tour.html" class="card">
                <h2>✈️ 문제 1-2</h2>
                <p>여행지 정보 (다중 체인)</p>
            </a>
            <a href="news.html" class="card">
                <h2>📰 문제 1-3</h2>
                <p>뉴스 키워드 (Few-Shot)</p>
            </a>
            <a href="search.html" class="card">
                <h2>🌐 추가 문제</h2>
                <p>웹 검색 에이전트 (Tavily 연동)</p>
            </a>
            <a href="history.html" class="card history" style="grid-column: 1 / -1;">
                <h2>📜 히스토리 관리</h2>
                <p>로컬 폴더(history_records)에 저장된 AI 실행 기록 조회 및 삭제</p>
            </a>
        </div>
    </div>
</body>
</html>
