<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 말투 변환기 — BizTalk Tone Converter</title>
    <meta name="description" content="AI 기반 비즈니스 텍스트 말투 변환 서비스. 수신 대상에 맞춰 정중하고 명확한 비즈니스 메시지로 자동 변환합니다.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-badge">AI Powered</div>
            <h1 class="app-title">업무 말투 변환기</h1>
            <p class="app-subtitle">원문 텍스트를 입력하고 수신 대상을 선택하면 최적의 비즈니스 어조로 자동 변환됩니다.</p>
        </header>

        <!-- Main Content Grid -->
        <main class="main-content">
            <!-- Left Panel: Input & Target Selection -->
            <section class="card input-card">
                <div class="card-header">
                    <span class="step-badge">1</span>
                    <h2>수신 대상 선택</h2>
                </div>
                
                <div class="target-grid" id="targetButtons">
                    <button type="button" class="target-btn active" data-target="boss">
                        <div class="btn-icon">👔</div>
                        <div class="btn-label">상사 / 임원</div>
                        <div class="btn-desc">격식 있는 경어체 및 공손한 보고 어조</div>
                    </button>
                    <button type="button" class="target-btn" data-target="colleague">
                        <div class="btn-icon">🤝</div>
                        <div class="btn-label">타팀 동료</div>
                        <div class="btn-desc">정중하되 협조적인 업무 요청 어조</div>
                    </button>
                    <button type="button" class="target-btn" data-target="client">
                        <div class="btn-icon">🏢</div>
                        <div class="btn-label">고객 / 외부</div>
                        <div class="btn-desc">친절하고 신뢰감 있는 서비스 어조</div>
                    </button>
                    <button type="button" class="target-btn" data-target="team">
                        <div class="btn-icon">⚡</div>
                        <div class="btn-label">팀 내 동료</div>
                        <div class="btn-desc">간결하고 실무 중심적인 커뮤니케이션</div>
                    </button>
                </div>

                <div class="card-header margin-top">
                    <span class="step-badge">2</span>
                    <h2>원문 텍스트 입력</h2>
                </div>
                
                <div class="textarea-wrapper">
                    <textarea 
                        id="inputText" 
                        placeholder="예: 내일까지 보고서 제출 어려울 것 같음. 일정 좀 미뤄줘."
                        rows="5"
                        maxlength="1000"
                    ></textarea>
                    <div class="char-count"><span id="currentCharCount">0</span> / 1000자</div>
                </div>

                <button type="button" id="convertBtn" class="primary-btn">
                    <span class="btn-text">✨ 업무 말투로 변환하기</span>
                    <div class="spinner hidden" id="btnSpinner"></div>
                </button>
            </section>

            <!-- Right Panel: Result Output -->
            <section class="card output-card">
                <div class="card-header">
                    <span class="step-badge">3</span>
                    <h2>변환 결과</h2>
                    <span class="target-chip" id="selectedTargetChip">👔 상사 / 임원 대상</span>
                </div>

                <div class="result-wrapper">
                    <div id="loadingOverlay" class="loading-overlay hidden">
                        <div class="pulse-spinner"></div>
                        <p class="loading-text">Solar-Pro3 AI가 비즈니스 말투로 변환 중입니다...</p>
                    </div>

                    <textarea 
                        id="outputText" 
                        placeholder="좌측에서 내용을 입력하고 [변환하기] 버튼을 누르면 변환된 비즈니스 메시지가 여기에 표시됩니다."
                        readonly
                        rows="10"
                    ></textarea>
                </div>

                <div class="output-actions">
                    <button type="button" id="copyBtn" class="secondary-btn" disabled>
                        <span class="icon">📋</span> 결과 복사하기
                    </button>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>BizTalk Tone Converter &copy; 2026. Powered by Upstage Solar-Pro3 & FastAPI.</p>
        </footer>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">클립보드에 복사되었습니다!</div>

    <script src="js/app.js"></script>
</body>
</html>
